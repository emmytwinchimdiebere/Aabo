name: Engineering task
description: Propose a scoped implementation task
title: ""
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the observable caller, dispatcher, or operator outcome.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is included and explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure behavior
      description: Explain how failures remain visible and recoverable.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective checks that establish completion.
    validations:
      required: true

